# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
# trading-fitness-metrics crate. ith-python consumes it as a uv path dependency (maturin), so
# `moon run ith-python:bindings` rebuilds the Python extension after Rust changes.
layer: 'library'
language: 'rust'

tasks:
  build:
    script: 'cargo build -p trading-fitness-metrics'
    inputs: ['src/**/*', 'Cargo.toml']
  test:
    script: 'cargo nextest run -p trading-fitness-metrics && cargo test --doc -p trading-fitness-metrics'
    inputs: ['src/**/*', 'tests/**/*', 'Cargo.toml']
  lint:
    script: 'cargo clippy -p trading-fitness-metrics -- -D warnings'
    inputs: ['src/**/*', 'Cargo.toml']
  fmt-check:
    script: 'cargo fmt -p trading-fitness-metrics -- --check'
    inputs: ['src/**/*', 'tests/**/*']
  check:
    deps: ['~:fmt-check', '~:lint', '~:test']
    script: "echo 'metrics-rust:check passed'"
    options: { cache: false }
